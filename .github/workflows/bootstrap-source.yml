name: Bootstrap BizPilot source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/BizPilot_GitHub_ready.zip"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

concurrency:
  group: bizpilot-bootstrap-main
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          unzip -t .bootstrap/BizPilot_GitHub_ready.zip
          rm -rf .bootstrap_unpack
          mkdir -p .bootstrap_unpack
          unzip -q .bootstrap/BizPilot_GitHub_ready.zip -d .bootstrap_unpack
          test -f .bootstrap_unpack/BizPilot_inspect/index.html
          test -f .bootstrap_unpack/BizPilot_inspect/css/styles.css
          test -f .bootstrap_unpack/BizPilot_inspect/js/app.js
          test -f .bootstrap_unpack/BizPilot_inspect/README.md
          test -f .bootstrap_unpack/BizPilot_inspect/.gitignore

      - name: Publish BizPilot source
        shell: bash
        run: |
          set -euo pipefail
          cp -a .bootstrap_unpack/BizPilot_inspect/. .
          rm -rf .bootstrap .bootstrap_unpack
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "feat: publish BizPilot source"
          git push origin HEAD:main
